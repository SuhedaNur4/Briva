<article class="event-card" data-event-id="{{ event.id if event else '' }}">
  <div class="event-card-header">
    <span class="event-category">{{ event.category if event else 'Kategori' }}</span>
    <span class="event-city">{{ event.city if event else 'Şehir' }}</span>
  </div>
  <div class="event-card-body">
    <h3 class="event-title">
      <a href="/events/{{ event.id if event else '#' }}">{{ event.title if event else 'Etkinlik Başlığı' }}</a>
    </h3>
    <p class="event-description">{{ event.description if event else 'Etkinlik açıklaması burada yer alacaktır.' }}</p>
  </div>
  <div class="event-card-footer">
    <span class="event-date">{{ event.start_date if event else 'Tarih belirtilmemiş' }}</span>
    <a href="/events/{{ event.id if event else '#' }}" class="btn btn-secondary">Detaylar</a>
  </div>
</article>
